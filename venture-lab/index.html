<title>Venture Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky brand bar + colour-coded tab rail; views swap on the hash. Dark-first "private bank" ink with jewel-tone business colours. */
:root{
  --bg:#0a0d16; --panel:#111626; --panel-2:#161c30; --line:#232b45; --fg:#eef1fa; --muted:#98a1bd; --gold:#d9b46a;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5fa; --panel:#ffffff; --panel-2:#eef0f7; --line:#dde1ee; --fg:#141a2e; --muted:#5b6482; --gold:#a07a2c;
  --good:#059669; --warn:#b45309; --bad:#dc2626; --shadow:0 10px 30px -16px rgba(20,26,46,.25); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f4f5fa; --panel:#ffffff; --panel-2:#eef0f7; --line:#dde1ee; --fg:#141a2e; --muted:#5b6482; --gold:#a07a2c;
  --good:#059669; --warn:#b45309; --bad:#dc2626; --shadow:0 10px 30px -16px rgba(20,26,46,.25); color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:conic-gradient(from 200deg,#34d399,#38bdf8,#a78bfa,#f472b6,#fbbf24,#34d399);display:grid;place-items:center}
.mark span{width:22px;height:22px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font:700 12px var(--display);color:var(--gold)}
.brand h1{font-size:18px}
.brand small{display:block;color:var(--muted);font-size:12px}
.themebtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 14px;font:500 13px var(--body);cursor:pointer}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{--c:var(--gold);flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 10%,var(--panel));color:var(--fg);padding:8px 13px;border-radius:10px;font:500 13px var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab .sc{font:600 11px var(--mono);color:var(--c)}
.tab[aria-current="page"]{background:color-mix(in srgb,var(--c) 26%,var(--panel));border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.tab.dim{opacity:.6}

main{padding-block:28px 64px}
section.view{display:flex;flex-direction:column;gap:24px}

/* Overview */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end}
.hero h2{font-size:clamp(26px,4vw,40px);line-height:1.1}
.hero h2 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--muted);max-width:62ch;margin:12px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:600 28px var(--display)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.g b{color:var(--good)} .kpi.a b{color:var(--warn)} .kpi.r b{color:var(--bad)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:17px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 16px}

/* Ranking chart */
.rank{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(120px,230px) 1fr 44px;gap:12px;align-items:center;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:2px 0}
.rrow .nm{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:14px;background:var(--panel-2);border-radius:999px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c))}
.thr{position:absolute;top:-5px;bottom:-5px;width:0;border-left:1.5px dashed var(--muted);opacity:.6}
.rrow .v{font:600 14px var(--mono);text-align:right}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{--c:var(--gold);position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,var(--panel)) 0%,var(--panel) 60%);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--c) 70%,transparent)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{font-size:17px}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--gold)) 14%,var(--panel-2));border:1px solid color-mix(in srgb,var(--c,var(--gold)) 30%,var(--line));white-space:nowrap}
.pill{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.a{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.r{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.ring{flex:0 0 auto}
.ring text{font-family:var(--mono);font-weight:600;fill:var(--fg)}

/* Report */
.rhead{--c:var(--gold);border-radius:22px;padding:26px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 30%,var(--panel)) 0%,var(--panel) 55%);display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.rhead h2{font-size:clamp(24px,3.4vw,34px);line-height:1.12}
.rhead p{color:var(--muted);margin:8px 0 0;max-width:70ch}
.rhead .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{--c:var(--gold);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat b{display:block;font:600 18px var(--display);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.crit{display:flex;flex-direction:column;gap:11px}
.crow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.crow .track{height:9px}
.crow .v{font:500 12px var(--mono);color:var(--muted);text-align:right}
ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
ul.list li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px}
ul.list li::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--c,var(--gold))}
.pros{--c:var(--good)} .cons{--c:var(--bad)}
.pc .panel{border-top:3px solid var(--c)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-bottom:0;color:var(--good)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.niches{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.niche{border-radius:14px;padding:14px;background:color-mix(in srgb,var(--c) 10%,var(--panel-2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.niche b{display:block;font-size:14px;margin-bottom:4px}
.niche span{font-size:13px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:38px 1fr;gap:14px;position:relative;padding-bottom:18px}
.step:not(:last-child)::after{content:"";position:absolute;left:18px;top:36px;bottom:0;border-left:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.step .n{counter-increment:s;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:600 13px var(--mono);background:color-mix(in srgb,var(--c) 22%,var(--panel-2));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.step .n::before{content:counter(s,decimal-leading-zero)}
.step b{display:block;font-size:14.5px}
.step span{font-size:13.5px;color:var(--muted)}
.step em{font-style:normal;font:500 11px var(--mono);color:var(--c);margin-left:6px}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pipe .node{padding:9px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--c) 14%,var(--panel-2));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.pipe .arr{color:var(--c);font-weight:700}
.comp li{grid-template-columns:20px 1fr}
.reg{border-left:3px solid var(--warn);padding:10px 14px;background:color-mix(in srgb,var(--warn) 8%,var(--panel-2));border-radius:0 10px 10px 0;font-size:13.5px}

/* Workflow */
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.phase{--c:var(--gold);border-radius:16px;padding:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));display:flex;flex-direction:column;gap:8px}
.phase .when{font:600 11px var(--mono);color:var(--c);letter-spacing:.06em}
.phase h3{font-size:15px}
.phase ul{margin:0;padding-left:16px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.gate{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gbox{border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--panel-2)}
.gbox.g{border-color:color-mix(in srgb,var(--good) 50%,var(--line))} .gbox.a{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))} .gbox.r{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.gbox b{display:block;margin-bottom:4px}
.gbox span{font-size:13px;color:var(--muted)}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dead{opacity:.85}
.small{font-size:13px;color:var(--muted)}
.src li{font-size:13px}
.src a{color:var(--fg);text-decoration-color:var(--line)}

@media (max-width:980px){.hero,.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.phases{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.rhead{grid-template-columns:1fr}.phases,.gate,.order{grid-template-columns:1fr}.crow{grid-template-columns:110px 1fr 46px}.rrow{grid-template-columns:110px 1fr 36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><div class="mark"><span>VL</span></div><div><h1>Venture Lab</h1><small>AI &amp; agentic business models · UK viability</small></div></div>

IDEAS.forEach(i=>{i.score=Math.round(CRIT.reduce((s,[k,,w])=>s+w*i.crit[k]/10,0))});
IDEAS.sort((a,b)=>b.score-a.score);
const tier=s=>s>=75?["g","Investigate"]:s>=50?["a","Watchlist"]:["r","Not viable"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ring(score,c,size=74){
  const r=size/2-6,C=2*Math.PI*r,off=C*(1-score/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score ${score} out of 100">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="7"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size*.28}">${score}</text></svg>`;
}

}

function route(){
  const id=(location.hash||"#overview").slice(1);
  const idea=IDEAS.find(i=>i.id===id);
  const app=document.getElementById("app");
  const cur=idea?id:(["workflow","method","radar","daily"].includes(id)?id:"overview");
  app.innerHTML= idea?report(idea): cur==="workflow"?workflow(): cur==="method"?method(): cur==="radar"?radar(): cur==="daily"?daily(): overview();
  renderTabs(cur);
  window.scrollTo({top:0});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]"); if(b){location.hash=b.dataset.go}});
window.addEventListener("hashchange",route);
document.getElementById("themebtn").addEventListener("click",()=>{
  const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":!matchMedia("(prefers-color-scheme: light)").matches;
  r.dataset.theme=dark?"light":"dark"; try{localStorage.setItem("vl-theme",r.dataset.theme)}catch(e){}
});
try{const t=localStorage.getItem("vl-theme"); if(t) document.documentElement.dataset.theme=t}catch(e){}
route();
